<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#7c5cff"><title>소소 파티게임</title><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/style.css"></head><body><main class="app"><header><div><div class="eyebrow">SOSO PARTY GAME</div><h1>🎉 소소 파티게임</h1><p>방 코드 하나로 모바일 · PC에서 함께 플레이</p></div><div class="header-actions"><button id="soundBtn" class="ghost">🔊</button><div id="roomBadge" class="room-badge hidden"></div></div></header>
<section id="home"><div class="panel"><h2>1. 프로필</h2><label>닉네임<input id="name" maxlength="12" placeholder="닉네임 입력"></label><span class="label">캐릭터</span><div id="avatars" class="avatars"></div></div><div class="panel"><h2>2. 게임 선택</h2><div id="games" class="game-grid"><button class="game active" data-game="liar"><b>🎭 라이어게임</b><em>3–10명</em><span>일반 · 스파이 · 질문</span></button><button class="game" data-game="mafia"><b>🌙 마피아게임</b><em>5–12명</em><span>마피아 · 경찰 · 의사 · 시민</span></button><button class="game" data-game="truth"><b>💬 진실게임</b><em>2–10명</em><span>이지 · 노멀 · 하드</span></button><button class="game" data-game="draw"><b>🎨 그림퀴즈</b><em>2–10명</em><span>실시간 그림판 · 스피드 정답</span></button><button class="game" data-game="rummi"><b>🔢 루미큐브</b><em>2–4명</em><span>드래그앤드롭 · 60초 턴</span></button></div><div id="liarModes" class="mode-row"><button class="mode active" data-mode="normal">🕵️ 일반게임</button><button class="mode" data-mode="question">🔢 질문게임</button></div><label>방 비밀번호 <span class="optional">선택</span><input id="createPassword" type="password" maxlength="24" placeholder="비워두면 공개방"></label><button id="createBtn" class="primary">선택한 게임으로 방 만들기</button><div class="join"><input id="codeInput" maxlength="5" placeholder="방 코드"><button id="joinBtn">방 코드로 참가</button></div><input id="joinPassword" type="password" maxlength="24" placeholder="참가 비밀번호 (필요한 경우)"></div></section>
<section id="room" class="hidden"><div class="panel"><div class="topline"><div><span id="phase" class="pill"></span><h2 id="roomTitle"></h2></div><div class="timer-wrap"><span id="timer" class="timer hidden"></span><span id="hostControls"></span></div></div><div id="mainCard" class="private-card"></div><div id="actionArea"></div></div><div id="settings" class="panel hidden"></div><div class="panel"><div class="section-head"><h3>참가자 <span id="count"></span></h3><button id="leaveBtn" class="danger-soft">나가기</button></div><div id="players" class="players"></div></div></section><div id="toast"></div></main><script src="/socket.io/socket.io.js"></script><script src="/app.js"></script></body></html>
